name: Build releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release when running manually, for example v0.6.5-beta3"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.release_tag || forgejo.ref_name }}

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Determine release metadata
        id: metadata
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_INPUT:-${FORGEJO_REF_NAME:-${GITHUB_REF_NAME}}}"

          if [[ -z "$tag" || "$tag" == "main" || "$tag" == "master" ]]; then
            echo "A release tag is required. Run this workflow from a tag or provide release_tag." >&2
            exit 1
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-((alpha|beta|rc)[0-9]*))?$ ]]; then
            echo "Release tag '$tag' is not a supported semantic version tag" >&2
            exit 1
          fi

          if [[ "$tag" =~ -(alpha|beta|rc)[0-9]*$ ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'notes<<EOF'
            git-cliff --latest
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create Forgejo release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: https://git.jonahmakowski.ca
          repo: ${{ forgejo.repository }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          tag: ${{ steps.metadata.outputs.tag }}
          release-notes: ${{ steps.changelog.outputs.notes }}
          prerelease: ${{ steps.metadata.outputs.prerelease }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            release create "$RELEASE_TAG"
            --title "$RELEASE_TAG"
            --notes "$RELEASE_NOTES"
            --repo jonahmakowski/cli-tool
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
