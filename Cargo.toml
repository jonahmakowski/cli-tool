[package]
name = "cli-tool"
version = "0.5.2"
edition = "2024"

[dependencies]
tempfile = "3.27.0"
reqwest = { version = "0.13.4", default-features = false, features = [ "json", "blocking", "rustls" ] }
serde_json = "1.0.150"
clap = { version = "4.6.2", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1.0.228", features = ["derive"] }
yaml_serde = "0.10.4"
directories = "6.0.0"
urlencoding = "2.1.3"
thiserror = "2.0.19"
indexmap = "2.14.0"
