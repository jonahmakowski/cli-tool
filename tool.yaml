preflight_commands:
  - name: Cargo FMT
    command: ["cargo", "fmt", "--check"]
  - name: Cargo Clippy
    command: ["cargo", "clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
  - name: Cargo Test
    command: ["cargo", "test"]
  - name: Run Subtitles Check Test
    command: ["cargo", "test", "subtitles_check", "--", "--ignored"]
    if: "changed src/plugins/yt.rs"
  - name: Update Changelog
    command: ["git-cliff", "--output", "CHANGELOG.md"]
    post_command: ["git", "add", "CHANGELOG.md"]
